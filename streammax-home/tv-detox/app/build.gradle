// HOME_RC is debug-only; production releases require a stable, user-owned signing key.
// Never commit a keystore, credentials or base64 secret into this repository.
def production = System.getenv('STREAMMAX_HOME_PRODUCTION') == 'true'
def homeStoreFile = System.getenv('STREAMMAX_HOME_KEYSTORE_FILE')
def homeStorePassword = System.getenv('STREAMMAX_HOME_STORE_PASSWORD')
def homeKeyAlias = System.getenv('STREAMMAX_HOME_KEY_ALIAS')
def homeKeyPassword = System.getenv('STREAMMAX_HOME_KEY_PASSWORD')
if (production && (![homeStoreFile, homeStorePassword, homeKeyAlias, homeKeyPassword].every { it != null && it.trim() })) {
    throw new GradleException('Signed production HOME build requires all four STREAMMAX_HOME signing variables')
}
plugins {
    id 'com.android.application'
}
android {
    namespace 'com.streammax.tvdetox'
    compileSdk 35
    defaultConfig {
        applicationId production ? 'com.streammax.home' : 'com.streammax.home.rc'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName production ? '1.0.0' : '1.0.0-rc1'
    }
    signingConfigs {
        homeRelease {
            if (production) {
                storeFile file(homeStoreFile)
                storePassword homeStorePassword
                keyAlias homeKeyAlias
                keyPassword homeKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (production) signingConfig signingConfigs.homeRelease
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
