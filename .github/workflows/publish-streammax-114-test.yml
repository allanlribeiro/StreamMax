name: Preparar download do StreamMax Legacy 1.0.14 TESTE
on:
  push:
    branches: [fix/streammax-legacy-addons-logo-1014]
    paths: [.github/workflows/publish-streammax-114-test.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: streammax-114-test-download
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Confirmar compilação da origem correta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/allanlribeiro/StreamMax/actions/runs/40087367885 --jq .head_sha)" = 627c1f36e72aa5eb48836a9eb64c7ca7072bce6e
          test "$(gh api repos/allanlribeiro/StreamMax/actions/runs/40087367885 --jq .conclusion)" = success
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: allanlribeiro/StreamMax
          run-id: 40087367885
          name: StreamMax-1.0.14-Addons-Logo-TESTE
          path: pacote
      - name: Conferir arquivo, pacote e assinatura
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -Fxq 'Commit: 627c1f36e72aa5eb48836a9eb64c7ca7072bce6e' pacote/BUILD-INFO.txt
          sha256sum --check pacote/SHA256.txt
          apk=pacote/StreamMax-1.0.14-android.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$aapt" dump badging "$apk" > badging.txt
          grep -q "^package: name='com.streammax.tv'" badging.txt
          grep -q "versionCode='20021'" badging.txt
          grep -Fq "versionName='1.0.14'" badging.txt
          mkdir approved
          gh release download v1.0.11 --repo allanlribeiro/StreamMax --pattern StreamMax-1.0.11-android.apk --dir approved
          "$signer" verify --print-certs "$apk" > new-cert.txt
          "$signer" verify --print-certs approved/StreamMax-1.0.11-android.apk > old-cert.txt
          test "$(awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}' new-cert.txt)" = "$(awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}' old-cert.txt)"
          printf 'APK_SHA256=%s\n' "$(sha256sum "$apk" | awk '{print $1}')"
          printf 'APK_BYTES=%s\n' "$(stat -c '%s' "$apk")"
      - name: Enviar somente ao rascunho de teste
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: allanlribeiro/StreamMax
        run: |
          set -euo pipefail
          test "$(gh release view v1.0.14-test --json isDraft --jq .isDraft)" = true
          gh release upload v1.0.14-test pacote/StreamMax-1.0.14-android.apk pacote/SHA256.txt pacote/BUILD-INFO.txt
          gh release view v1.0.14-test --json assets --jq '.assets[] | {name,size,state}'
