name: Package verified StreamMax track menu test APK
on:
  push:
    branches: [feature/streammax-audio-subtitle-panels]
    paths: ['.github/workflows/streammax-track-panels-package.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  package-verified-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require matching successful APK and native UI checks
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/39773676691)"
          test "$(jq -r .conclusion <<< "$metadata")" = success
          test "$(jq -r .head_sha <<< "$metadata")" = aa9e8284fc6c635a5409e884b9f3cfda41629156
          preview="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/39771945412)"
          test "$(jq -r .conclusion <<< "$preview")" = success
          test "$(jq -r .head_sha <<< "$preview")" = 312879757cde1015c17fa0f1bfd76ad9f9314370
      - uses: actions/download-artifact@v4
        with:
          name: StreamMax-1.0.11-new-menus
          path: package
          run-id: 39773676691
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: StreamMax-new-menus-preview
          path: previews
          run-id: 39771945412
          github-token: ${{ github.token }}
      - name: Record verified bytes and draft release notes
        shell: bash
        run: |
          set -euo pipefail
          test -s package/StreamMax-1.0.11-new-menus-android.apk
          (cd package && sha256sum StreamMax-1.0.11-new-menus-android.apk > StreamMax-new-menus-SHA256.txt)
          cat > notes.md <<'MD'
          APK de teste dos novos menus, baseado no StreamMax 1.0.11.

          - Áudio e legendas continuam em painéis separados, com fundo mais escuro.
          - Idiomas completos, incluindo Português (Brasil) e Português (Portugal), com quebra de linha.
          - Legendas em uma lista principal; o filtro de idiomas abre em tela própria.
          - Aparência e sincronização abrem separadamente. Atraso fica em Sincronização.
          - Legenda secundária fica em Mais opções. Direita chega aos ajustes sem percorrer uma lista longa.

          Assinatura compatível com o aplicativo oficial. Instalação manual sobre a versão atual, sem desinstalar. Este APK mantém a versão base 1.0.11 e o pacote com.streammax.tv. Não é uma atualização OTA publicada.

          Testes de navegação reais com faixas simuladas, capturas do renderer, compilação nativa/Linux, build Android completo e verificação de assinatura passaram. As imagens anexadas são prévias do aplicativo com faixas simuladas, sem um filme em reprodução.

          Pendente: conferir o resultado na TV com o controle remoto e a escala de interface usados pelo proprietário.

          Código e verificações: https://github.com/allanlribeiro/StreamMax/pull/37
          MD
      - name: Create test draft only, without publishing OTA
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.0.11-menus-test --repo "$GITHUB_REPOSITORY" \
            --draft --target aa9e8284fc6c635a5409e884b9f3cfda41629156 \
            --title 'StreamMax — Teste dos novos menus de áudio e legendas' \
            --notes-file notes.md package/* previews/*.png
