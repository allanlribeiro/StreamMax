name: StreamMax teste no emulador Samsung
on:
  push:
    branches: [feat/streammax-windows-tizen-ports]
    paths: [.github/workflows/streammax-tizen-emulator.yml]
  workflow_dispatch:
    inputs:
      build_run:
        description: Run contendo o WGT StreamMax-Tizen
        required: true
permissions:
  contents: read
  actions: read
jobs:
  samsung:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Baixar a origem exata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" > "$RUNNER_TEMP/streammax-source.tar.gz"
          tar xzf "$RUNNER_TEMP/streammax-source.tar.gz" --strip-components=1

      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verificar virtualização
        run: |
          lscpu | grep -E 'Virtualization|Hypervisor' || true
          ls -l /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Bibliotecas do emulador
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa libjpeg-turbo8 libsdl1.2debian libv4l-0 libxcb-icccm4 libxcb-image0 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxkbcommon-x11-0 libsm6 libnss3 libasound2 libpulse0 libfontconfig1 libxi6
      - name: SDK e imagem oficial Samsung
        run: |
          exec > >(tee "$RUNNER_TEMP/streammax-sdk.log") 2>&1
          trap 'python3 tests/ports/annotate-error.py "$RUNNER_TEMP/streammax-sdk.log"' ERR
          mkdir -p "$RUNNER_TEMP/tizen-installer" "$RUNNER_TEMP/tizen-studio"
          curl -fL https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin -o "$RUNNER_TEMP/tizen.bin"
          tail -n +171 "$RUNNER_TEMP/tizen.bin" | tar xzf - -C "$RUNNER_TEMP/tizen-installer"
          unzip -q "$RUNNER_TEMP/tizen-installer/tizen-sdk.zip" -d "$RUNNER_TEMP/tizen-studio"
          python3 tests/ports/install-tizen-emulator.py "$RUNNER_TEMP/tizen-studio"
      - name: Aguardar pacote compilado
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          build_run='${{ inputs.build_run }}'
          if [ -z "$build_run" ]; then build_run=$(gh run list --workflow streammax-ports.yml --branch feat/streammax-windows-tizen-ports --limit 1 --json databaseId --jq '.[0].databaseId'); fi
          for attempt in $(seq 1 120); do
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build_run/artifacts" --jq '.artifacts[] | select(.name=="StreamMax-Tizen") | .id')
            if [ -n "$artifact" ]; then break; fi
            sleep 10
          done
          test -n "$artifact"
          gh run download "$build_run" --name StreamMax-Tizen --dir legacy-source
          npm ci --prefix desktop --ignore-scripts
      - name: Instalar e testar no emulador
        env:
          QT_X11_NO_MITSHM: 1
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          exec > >(tee "$RUNNER_TEMP/streammax-emulator.log") 2>&1
          trap 'python3 tests/ports/annotate-error.py "$RUNNER_TEMP/streammax-emulator.log"' ERR
          xvfb-run -a bash tests/ports/tizen-emulator.sh "$RUNNER_TEMP/tizen-studio"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testes-emulador-Samsung
          path: |
            output/tizen-emulador
            ${{ runner.temp }}/tizen-studio/PACKAGES.json
            ${{ runner.temp }}/tizen-studio/data/emulator/vms/StreamMaxTV/logs
