name: StreamMax Home Teste — Android TV

on:
  push:
    branches:
      - streammax/home-tcl-p7k-experimental
    paths:
      - "streammax-home/**"
      - ".github/workflows/streammax-home-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-home:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Buscar código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK experimental
        working-directory: streammax-home
        run: gradle --no-daemon :app:assembleDebug

      - name: Auditar APK (sem ads, Internet ou takeover HOME)
        shell: bash
        run: |
          set -euo pipefail
          APK="streammax-home/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/streammax-home-badging.txt
          grep -q "package: name='com.streammax.home.teste'" /tmp/streammax-home-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > /tmp/streammax-home-permissions.txt
          if grep -q 'android.permission.INTERNET' /tmp/streammax-home-permissions.txt; then
            echo "::error::O launcher de teste nao pode ter acesso a Internet"
            exit 1
          fi
          if grep -q 'android.intent.category.HOME' streammax-home/app/src/main/AndroidManifest.xml; then
            echo "::error::A fase de teste nao pode assumir o botao HOME"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/StreamMax-Home-Teste.apk
          echo "APK de teste isolado: OK"

      - name: Publicar APK experimental
        uses: actions/upload-artifact@v4
        with:
          name: StreamMax-Home-Teste-${{ github.run_number }}
          path: dist/StreamMax-Home-Teste.apk
          if-no-files-found: error
          retention-days: 30
