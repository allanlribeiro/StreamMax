name: StreamMax TV - 3-column guide checks

on:
  push:
    branches:
      - streammax/live-tv-three-columns-tcl-1018
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-tv-native:
    name: Live TV layout and native build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar fonte dublada PT-BR antes de integrar a nova tela
        run: bash legacy-source/tests/streammax-source-ptbr.sh
      - name: Validar tres colunas com categorias, canais e EPG
        run: bash legacy-source/tests/streammax-livetv-columns.sh
      - name: Validar identidade visual e controles do player
        run: python3 migration/check-player-original-style.py legacy-source
      - name: Instalar dependencias nativas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
            libgles2-mesa-dev libegl1-mesa-dev zlib1g-dev
      - name: Compilar player e guia TV nativos
        working-directory: legacy-source
        run: bash tools/linux.sh --build
