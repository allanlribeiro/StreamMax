name: StreamMax Windows experimental

on:
  workflow_dispatch:
  push:
    branches:
      - streammax/windows-desktop

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-angleproject
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-dlfcn

      - name: Criar configuracao publica temporaria
        run: |
          cat > legacy-source/local.properties <<'EOF'
          NUVIO_SUPABASE_URL=https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
          TV_LOGIN_WEB_BASE_URL=https://nuvio.tv/tv-login
          EOF

      - name: Compilar StreamMax.exe
        working-directory: legacy-source
        run: bash tools/windows.sh --build

      - name: Montar pacote portatil
        working-directory: legacy-source
        run: |
          set -euo pipefail
          mkdir -p build/windows/package
          cp build/windows/StreamMax.exe build/windows/package/
          # Descobrir dependencias pelo binario, nao por lista fixa de DLLs.
          # Impede builds verdes com ZIP que nao abre por falta de bibliotecas.
          bash tools/windows-bundle-dlls.sh build/windows/package
          cp -r deploy/app/art build/windows/package/art
          test -s build/windows/package/StreamMax.exe
          test -d build/windows/package/art
          printf 'StreamMax para Windows (experimental W0)\nExtraia todo o ZIP antes de executar StreamMax.exe.\nNao mova o EXE para fora desta pasta.\nO player de video ainda nao esta implementado nesta fase.\n' > build/windows/package/LEIA-ME.txt


      - name: Publicar pacote Windows
        uses: actions/upload-artifact@v4
        with:
          name: StreamMax-Windows-x64-W0
          path: legacy-source/build/windows/package
          if-no-files-found: error
