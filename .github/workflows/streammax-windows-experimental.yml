name: StreamMax Windows experimental

on:
  workflow_dispatch:
  push:
    branches:
      - streammax/windows-desktop

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-angleproject
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-dlfcn
            mingw-w64-ucrt-x86_64-curl

      - name: Criar configuracao publica temporaria
        run: |
          cat > legacy-source/local.properties <<'EOF'
          NUVIO_SUPABASE_URL=https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY=sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
          TV_LOGIN_WEB_BASE_URL=https://nuvio.tv/tv-login
          EOF

      - name: Compilar StreamMax.exe
        working-directory: legacy-source
        run: bash tools/windows.sh --build

      - name: Montar pacote portatil
        working-directory: legacy-source
        run: |
          set -euo pipefail
          mkdir -p build/windows/package
          cp build/windows/StreamMax.exe build/windows/package/
          # Descobrir dependencias pelo binario, nao por lista fixa de DLLs.
          # Impede builds verdes com ZIP que nao abre por falta de bibliotecas.
          bash tools/windows-bundle-dlls.sh build/windows/package
          cp -r deploy/app/art build/windows/package/art
          # Sem as fontes o layout abre, mas o teclado e o login ficam SEM
          # letras (reproduzido pelo relato do Windows).
          cp -r deploy/app/fonts build/windows/package/fonts
          test -s build/windows/package/StreamMax.exe
          test -d build/windows/package/art
          test -s build/windows/package/art/discord-ca.pem || { echo "::error::Bundle de certificados TLS ausente"; exit 1; }
          test -s build/windows/package/libcurl-4.dll || { echo "::error::libcurl nao incluida no instalador"; exit 1; }
          for fonte in InterDisplay-Regular.ttf InterDisplay-Bold.ttf Roboto-Regular.ttf Montserrat-Regular.ttf; do
            test -s "build/windows/package/fonts/$fonte" || { echo "::error::Fonte do teclado faltando: $fonte"; exit 1; }
          done
          printf 'StreamMax para Windows (experimental W0)\nExtraia todo o ZIP antes de executar StreamMax.exe.\nNao mova o EXE para fora desta pasta.\nO player de video ainda nao esta implementado nesta fase.\n' > build/windows/package/LEIA-ME.txt


      - name: Testar HTTPS com libcurl empacotada e PATH limpo
        shell: pwsh
        working-directory: legacy-source
        run: |
          # Sem email, senha nem tokens: GET publico verifica libcurl,
          # cadeia de certificados e transporte HTTPS no pacote distribuivel.
          $folder = (Resolve-Path "build/windows/package").Path
          $exe = Join-Path $folder "StreamMax.exe"
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = $exe
          $psi.Arguments = "--network-self-test"
          $psi.WorkingDirectory = $folder
          $psi.UseShellExecute = $false
          $psi.Environment["PATH"] = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          $p = [System.Diagnostics.Process]::new()
          $p.StartInfo = $psi
          try {
            if (-not $p.Start()) { throw "Nao foi possivel iniciar teste HTTPS" }
            if (-not $p.WaitForExit(40000)) {
              $p.Kill()
              $p.WaitForExit()
              throw "Teste HTTPS excedeu 40 segundos"
            }
            if ($p.ExitCode -ne 0) {
              $log = Join-Path $env:LOCALAPPDATA "StreamMax\nuvio.log"
              if (Test-Path $log) { Get-Content $log -Tail 30 }
              throw "Teste HTTPS reprovado: codigo $($p.ExitCode). Corrija libcurl/certificados antes de publicar."
            }
            Write-Host "OK: HTTPS validado no StreamMax.exe isolado do MSYS2."
          }
          finally { $p.Dispose() }

      - name: Testar abertura do EXE com PATH limpo
        shell: pwsh
        working-directory: legacy-source
        run: |
          # Exercita o carregador real do Windows, sem DLLs vindas do PATH do MSYS2.
          # Sucesso na compilacao e presenca das DLLs nao provam que o EXE abre.
          $folder = (Resolve-Path "build/windows/package").Path
          $exe = Join-Path $folder "StreamMax.exe"
          $info = [System.Diagnostics.ProcessStartInfo]::new()
          $info.FileName = $exe
          $info.WorkingDirectory = $folder
          $info.UseShellExecute = $false
          $info.Environment["PATH"] = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          $proc = [System.Diagnostics.Process]::new()
          $proc.StartInfo = $info
          try {
            if (-not $proc.Start()) { throw "CreateProcess retornou false" }
          } catch {
            throw "EXE nao inicia num Windows sem MSYS2 no PATH: $($_.Exception.Message)"
          }
          # O teste anterior apenas conferia o PID, mesmo com tela preta.
          # Agora exige uma janela visivel de verdade com titulo StreamMax.
          $janelaPronta = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Milliseconds 500
            $proc.Refresh()
            if ($proc.HasExited) {
              throw "StreamMax encerrou antes de abrir a janela (exit code $($proc.ExitCode))"
            }
            $titulo = $proc.MainWindowTitle
            $handle = $proc.MainWindowHandle
            if ($handle -ne [IntPtr]::Zero -and $titulo -like "StreamMax*") {
              Write-Host "Janela detectada: $titulo / HWND=$handle"
              $janelaPronta = $true
              break
            }
          }
          if (-not $janelaPronta) {
            $proc.Kill(); $proc.WaitForExit()
            throw "Smoke-test reprovado: o processo abriu, mas nao exibiu uma janela StreamMax em 15 segundos."
          }
          # Exigir um quadro renderizado, nao apenas o handle da janela.
          $diagnostico = Join-Path $env:LOCALAPPDATA "StreamMax\diagnostico-inicio.txt"
          $quadro = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            $proc.Refresh()
            if ($proc.HasExited) { throw "StreamMax saiu antes do primeiro quadro: $($proc.ExitCode)" }
            if ((Test-Path $diagnostico) -and (Select-String -Path $diagnostico -Pattern "quadro-1" -SimpleMatch -Quiet)) {
              $quadro = $true
              break
            }
          }
          if (-not $quadro) {
            if (Test-Path $diagnostico) { Get-Content $diagnostico -Tail 25 }
            $proc.Kill(); $proc.WaitForExit()
            throw "Smoke-test reprovado: janela abriu, mas nenhum quadro real foi renderizado em 30 segundos."
          }
          Write-Host "OK: janela StreamMax visivel e primeiro quadro renderizado com PATH limpo."
          $proc.Kill()
          $proc.WaitForExit()
          $proc.Dispose()
      - name: Preparar Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            throw "Compilador Inno Setup 6 indisponivel"
          }
          Write-Host "ISCC: $iscc"

      - name: Gerar StreamMax-Setup.exe
        shell: pwsh
        working-directory: legacy-source
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\streammax-windows.iss"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o instalador Inno Setup" }
          $setup = "build\windows\installer\StreamMax-Setup-Windows-x64.exe"
          if (-not (Test-Path $setup)) { throw "Instalador nao encontrado: $setup" }
          Write-Host "Instalador criado: $((Get-Item $setup).Length) bytes"

      - name: Testar instalacao real do StreamMax-Setup.exe
        shell: pwsh
        working-directory: legacy-source
        run: |
          # Teste silencioso apenas no runner: simula a instalacao normal do wizard.
          $setup = (Resolve-Path "build/windows/installer/StreamMax-Setup-Windows-x64.exe").Path
          $dest = Join-Path $env:RUNNER_TEMP "StreamMax-Setup-Teste"
          $arguments = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dest")
          $p = Start-Process -FilePath $setup -ArgumentList $arguments -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Instalador retornou $($p.ExitCode)" }
          foreach ($file in @("StreamMax.exe", "SDL2.dll", "libGLESv2.dll", "libdl.dll", "libcurl-4.dll", "art\discord-ca.pem")) {
            if (-not (Test-Path (Join-Path $dest $file))) { throw "Instalacao incompleta: $file" }
          }
          if (-not (Test-Path (Join-Path $dest "art"))) { throw "Instalacao sem pasta art" }
          foreach ($font in @("InterDisplay-Regular.ttf", "InterDisplay-Bold.ttf", "Roboto-Regular.ttf", "Montserrat-Regular.ttf")) {
            if (-not (Test-Path (Join-Path $dest "fonts\$font"))) { throw "Instalador perdeu a fonte: $font" }
          }
          if (-not (Get-ChildItem $dest -Filter "unins*.exe" -ErrorAction SilentlyContinue)) {
            throw "Desinstalador nao foi criado"
          }
          Write-Host "OK: instalador executado, app/DLLs/art e desinstalador presentes."
      - name: Publicar instalador StreamMax Windows
        uses: actions/upload-artifact@v4
        with:
          name: StreamMax-Instalador-Windows-${{ github.run_number }}
          path: legacy-source/build/windows/installer/StreamMax-Setup-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publicar pacote Windows
        uses: actions/upload-artifact@v4
        with:
          name: StreamMax-Windows-x64-W0
          path: legacy-source/build/windows/package
          if-no-files-found: error
