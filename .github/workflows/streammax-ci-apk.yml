name: StreamMax - Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build full debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI_USE_DEBUG_SIGNING: "true"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runner already includes the Android SDK.
      # Avoid the obsolete SDK "tools" package installation.

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Optional QR login backend settings
        env:
          NUVIO_SUPABASE_URL: ${{ vars.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
        run: |
          if [[ -n "$NUVIO_SUPABASE_URL" && -n "$NUVIO_SUPABASE_ANON_KEY" ]]; then
            printf 'NUVIO_SUPABASE_URL=%s\nNUVIO_SUPABASE_ANON_KEY=%s\n' \
              "$NUVIO_SUPABASE_URL" "$NUVIO_SUPABASE_ANON_KEY" > local.dev.properties
            echo "QR login backend configuration provided."
          else
            echo "::warning::QR login requires NUVIO_SUPABASE_URL and NUVIO_SUPABASE_ANON_KEY in GitHub repository settings."
          fi

      - name: Use debug signing only during CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          old = '        debug {\n            signingConfig = signingConfigs.getByName("release")'
          new = '        debug {\n            signingConfig = signingConfigs.getByName("debug")'
          if s.count(old) != 1:
              raise SystemExit("Expected signing configuration was not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Assemble test APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullDebug --no-daemon --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Publish APKs
        uses: actions/upload-artifact@v4
        with:
          name: StreamMax-test-apks
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
