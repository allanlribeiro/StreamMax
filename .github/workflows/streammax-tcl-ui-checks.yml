name: StreamMax TCL - source and UI checks

on:
  pull_request:
    branches:
      - streammax/legacy-migration
      - streammax/tcl-player-source-branding-1018
      - streammax/integracao-rc1-aprovada-tcl-1019
    paths:
      - 'legacy-source/src/app.c'
      - 'legacy-source/src/detail.c'
      - 'legacy-source/src/posplay.c'
      - 'legacy-source/src/streammax_next_prefetch.h'
      - 'legacy-source/tests/test_streammax_next_prefetch.c'
      - 'legacy-source/tests/streammax-next-prefetch.sh'
      - 'legacy-source/android/app/src/main/java/space/nuvio/nativelegacy/NvPlayer.kt'
      - 'migration/check-player-original-engine.py'
      - 'legacy-source/src/ajustes.c'
      - 'legacy-source/src/streams.c'
      - 'legacy-source/src/stream_parse.c'
      - 'legacy-source/src/streammax_source_ptbr.h'
      - 'legacy-source/tests/test_streammax_source_ptbr.c'
      - 'legacy-source/tests/streammax-source-ptbr.sh'
      - 'legacy-source/src/streammax_first_source.h'
      - 'legacy-source/tests/test_streammax_first_source.c'
      - 'legacy-source/tests/streammax-first-source.sh'
      - 'legacy-source/src/player.c'
      - 'legacy-source/src/plrui.c'
      - 'legacy-source/src/plrui.h'
      - 'legacy-source/src/streammax_player_layout.h'
      - 'legacy-source/tests/test_streammax_player_layout.c'
      - 'legacy-source/tests/streammax-player-layout.sh'
      - 'migration/check-player-original-style.py'
      - 'legacy-source/src/text.c'
      - 'legacy-source/src/logoapp.c'
      - 'legacy-source/src/logoapp.h'
      - 'legacy-source/src/login.c'
      - 'legacy-source/src/perfilsel.c'
      - 'legacy-source/src/guia.c'
      - 'legacy-source/deploy/app/art/marcas/streammax_icon.png'
      - 'legacy-source/deploy/app/art/marcas/streammax_banner.png'
      - 'legacy-source/tests/streammax-brand-rc1.sh'
      - 'legacy-source/src/streammax_ui_brand.h'
      - 'legacy-source/src/ajustes_ux_padrao.inc'
      - 'legacy-source/tests/test_streammax_ui_brand.c'
      - 'legacy-source/tests/streammax-ui-brand.sh'
      - 'migration/check-playback-contracts.py'
      - '.github/workflows/streammax-tcl-ui-checks.yml'

permissions:
  contents: read

jobs:
  native-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar marca apenas na interface
        run: bash legacy-source/tests/streammax-ui-brand.sh
      - name: Confirmar assets e marca da RC1 aprovada
        run: bash legacy-source/tests/streammax-brand-rc1.sh
      - name: Testar geometria dos controles fixos
        run: bash legacy-source/tests/streammax-player-layout.sh
      - name: Validar paridade visual do player sem APK
        run: python3 migration/check-player-original-style.py legacy-source
      - name: Testar escolha inicial e memoria de fontes (sem rede)
        run: bash legacy-source/tests/streammax-first-source.sh
      - name: Validar filtro de fonte dublada PT-BR (sem rede)
        run: bash legacy-source/tests/streammax-source-ptbr.sh
      - name: Testar prefetch de fonte sem escolha automatica inesperada
        run: bash legacy-source/tests/streammax-next-prefetch.sh
      - name: Conferir base de reprodução Media3 original (sem APK)
        run: python3 migration/check-player-original-engine.py
      - name: Validar contratos de reproducao do Legacy
        run: python3 migration/check-playback-contracts.py legacy-source
      - name: Preparar compilacao nativa Linux sem gerar APK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
            libgles2-mesa-dev libegl1-mesa-dev zlib1g-dev
      - name: Compilar player nativo e restante da interface (sem APK)
        working-directory: legacy-source
        run: bash tools/linux.sh --build
