name: StreamMax Home 1.0 — APK assinado

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STREAMMAX_HOME_PRODUCTION: 'true'
      HOME_STORE_B64: ${{ secrets.STREAMMAX_HOME_KEYSTORE_B64 }}
      STREAMMAX_HOME_STORE_PASSWORD: ${{ secrets.STREAMMAX_HOME_STORE_PASSWORD }}
      STREAMMAX_HOME_KEY_ALIAS: ${{ secrets.STREAMMAX_HOME_KEY_ALIAS }}
      STREAMMAX_HOME_KEY_PASSWORD: ${{ secrets.STREAMMAX_HOME_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verificar segredos da assinatura privada
        shell: bash
        run: |
          set -euo pipefail
          for secret in HOME_STORE_B64 STREAMMAX_HOME_STORE_PASSWORD STREAMMAX_HOME_KEY_ALIAS STREAMMAX_HOME_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Configure o segredo obrigatorio ${secret} em Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$HOME_STORE_B64" | base64 --decode > "$RUNNER_TEMP/streammax-home-release.jks"
          test -s "$RUNNER_TEMP/streammax-home-release.jks"
          echo "STREAMMAX_HOME_KEYSTORE_FILE=$RUNNER_TEMP/streammax-home-release.jks" >> "$GITHUB_ENV"
          echo "Chave privada carregada com acesso restrito, sem exibir senhas."
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Renderizar wallpaper estático
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user 'CairoSVG==2.7.1' 'Pillow==11.3.0'
          python3 - <<'PY'
          import io
          from pathlib import Path
          import cairosvg
          from PIL import Image
          root = Path("streammax-home/tv-detox")
          src = root / "art" / "streammax-metal-waves.svg"
          dest = root / "app/src/main/res/drawable-nodpi/streammax_metal_waves.jpg"
          dest.parent.mkdir(parents=True, exist_ok=True)
          png = cairosvg.svg2png(url=str(src), output_width=1600, output_height=900)
          with Image.open(io.BytesIO(png)) as art:
              art.convert("RGB").save(dest, "JPEG", quality=86, optimize=True, progressive=True, subsampling=0)
          assert dest.stat().st_size < 1_500_000
          PY
      - name: Compilar StreamMax Home release
        working-directory: streammax-home/tv-detox
        run: gradle --no-daemon :app:assembleRelease
      - name: Verificar assinatura, HOME e ausência de permissões destrutivas
        shell: bash
        run: |
          set -euo pipefail
          APK="streammax-home/tv-detox/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/streammax-home-badging
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > /tmp/streammax-home-permissions
          grep -q "package: name='com.streammax.home'" /tmp/streammax-home-badging
          grep -q 'android.permission.INTERNET' /tmp/streammax-home-permissions
          ! grep -Eq 'android.permission.(ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|ACCESS_BACKGROUND_LOCATION|REQUEST_DELETE_PACKAGES)' /tmp/streammax-home-permissions
          grep -q 'android.intent.category.HOME' streammax-home/tv-detox/app/src/main/AndroidManifest.xml
          ! grep -Rq 'Intent.ACTION_DELETE' streammax-home/tv-detox/app/src/main/java
          mkdir -p dist
          cp "$APK" dist/StreamMax-Home-1.0.0-assinado.apk
          echo "APK release assinado, HOME elegível e sem permissões destrutivas."
      - uses: actions/upload-artifact@v4
        with:
          name: StreamMax-Home-1.0.0-assinado
          path: dist/StreamMax-Home-1.0.0-assinado.apk
          retention-days: 30
          if-no-files-found: error
