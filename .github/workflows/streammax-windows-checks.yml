name: StreamMax Windows Desktop
on:
  push:
    branches: [feature/streammax-windows-desktop]
    paths:
      - 'desktop/**'
      - '.github/workflows/streammax-windows-checks.yml'
  workflow_dispatch:
jobs:
  windows-desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS and manifest
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
          node --check home-state.js
          node --test tests/home-state.test.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test icon source and installer eligibility
        id: official_icon
        shell: pwsh
        run: |
          if (Test-Path assets/streammax-s.png) {
            "available=true" >> $env:GITHUB_OUTPUT
            Write-Output 'Logo S source found; eligible for packaging.'
          } else {
            "available=false" >> $env:GITHUB_OUTPUT
            Write-Output 'Official S artwork not present; no installer will be published.'
          }
      - name: Generate multi-size Windows icon from approved S
        if: steps.official_icon.outputs.available == 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/make_icon.py
      - name: Build unsigned Windows test installer
        if: steps.official_icon.outputs.available == 'true'
        shell: pwsh
        run: |
          npm run dist
      - name: Publish test installer as workflow artifact
        if: steps.official_icon.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: StreamMax-Windows-Preview-unsigned
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
