name: StreamMax player contracts (sem APK)

on:
  push:
    branches:
      - streammax/player-original-tcl-1018
    paths:
      - 'legacy-source/src/app.c'
      - 'legacy-source/src/detail.c'
      - 'legacy-source/src/streammax_first_source.h'
      - 'legacy-source/src/fontepref.c'
      - 'legacy-source/src/streams.c'
      - 'legacy-source/src/posplay.c'
      - 'legacy-source/tests/**'
      - 'migration/check-player-original-engine.py'
      - 'legacy-source/android/app/src/main/java/space/nuvio/nativelegacy/NvPlayer.kt'
      - '.github/workflows/streammax-player-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    name: Validar fonte, continuidade e Media3 (sem compilar Android)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar codigo da branch
        uses: actions/checkout@v4
      - name: Testar escolha inicial da fonte
        run: bash legacy-source/tests/streammax-first-source.sh
      - name: Testar preparacao do proximo episodio
        run: bash legacy-source/tests/streammax-next-prefetch.sh
      - name: Proteger comportamento do player Media3 e filtros de audio
        run: python3 migration/check-player-original-engine.py
      - name: Identificar revisao validada
        run: echo "Player contracts commit $GITHUB_SHA"
