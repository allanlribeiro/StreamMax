name: StreamMax APK experimental

# APK da base Legacy, contendo o player Media3 e as atualizacoes TCL.
# Nao confundir com o APK Kotlin/fullDebug da branch feature/reproducao-idiomas-nuvio.
# Mantem login por e-mail e bibliotecas nativas completas.
on:
  push:
    branches: [streammax/live-tv-three-columns-tcl-1018, streammax/tcl-feedback-four-fixes-1018, streammax/integracao-pre-apk-1018]
    paths:
      - '.github/workflows/streammax-apk-experimental.yml'
      - 'legacy-source/src/guia.c'
      - 'legacy-source/src/streammax_livetv_columns.h'
      - 'legacy-source/src/streams.c'
      - 'legacy-source/src/streammax_source_ptbr.h'
      - 'legacy-source/src/stream_parse.c'
      - 'legacy-source/art/marcas/streammax_splash.jpg'
      - 'legacy-source/src/abertura.c'
      - 'migration/check-playback-contracts.py'
      - 'legacy-source/tests/test_streammax_first_source.c'
      - 'legacy-source/tests/streammax-livetv-columns.sh'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [streammax/legacy-migration]
    paths:
      - '.github/workflows/streammax-apk-experimental.yml'
      - 'legacy-source/android/app/src/main/java/space/nuvio/nativelegacy/NvPlayer.kt'
      - 'migration/check-player-original-engine.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-experimental:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Baixar código da PR de reprodução
        uses: actions/checkout@v4
        # Em pull_request, checkout usa o merge-ref da PR com as mudancas
        # reais do player. No despacho manual, usa a branch escolhida.
      - name: Confirmar origem Legacy e marca StreamMax antes de compilar
        shell: bash
        run: |
          set -euo pipefail
          test -f legacy-source/src/login.c
          test -f legacy-source/android/app/src/main/AndroidManifest.xml
          python3 migration/check-legacy-auth.py legacy-source
          python3 migration/check-android-isolation.py legacy-source
          if [[ "$GITHUB_REF_NAME" == "streammax/tcl-feedback-four-fixes-1018" ]]; then
            grep -Fq 'semLinkReproduzivel++' legacy-source/src/stream_parse.c
            grep -Fq 'desenharEstiloResumo' legacy-source/src/legendasui.c
            grep -Fq 'gfx_furo_raio(pv, raio);' legacy-source/src/guia.c
          fi
          echo "Origem verificada: codigo Legacy, commit $(git rev-parse --short HEAD)"
      - name: Conferir o player Media3 e escolha manual desta revisao
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'player_definir_retomada_fonte(posTroca)' legacy-source/src/app.c
          grep -Fq 't == epTrocaT && e == epTrocaE' legacy-source/src/app.c
          grep -Fq 'val backBufferMs = if (inicioOriginal && !preparando) 1_500 else 0' legacy-source/android/app/src/main/java/space/nuvio/nativelegacy/NvPlayer.kt
          grep -Fq 'val vigiaPrimeiroQuadro = Runnable' legacy-source/android/app/src/main/java/space/nuvio/nativelegacy/NvPlayer.kt
          grep -Fq 'streammax_should_ask_episode_source(' legacy-source/src/detail.c
          python3 migration/check-player-original-engine.py
          bash legacy-source/tests/streammax-first-source.sh
          bash legacy-source/tests/streammax-next-prefetch.sh
          bash legacy-source/tests/streammax-source-ptbr.sh
          bash legacy-source/tests/streammax-livetv-columns.sh
          echo "Revisao StreamMax do player e TV ao vivo: $(git rev-parse --short HEAD)"
          python3 migration/check-playback-contracts.py legacy-source
      - name: Configurar Nuvio Cloud oficial para login por e-mail
        shell: bash
        env:
          # Dados PUBLICOS do NuvioMedia/self-host/.env.example.
          NUVIO_CLOUD_URL: https://api.nuvio.tv
          NUVIO_CLOUD_PUBLISHABLE_KEY: sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
        run: |
          set -euo pipefail
          [[ "$NUVIO_CLOUD_URL" == "https://api.nuvio.tv" ]]
          [[ "$NUVIO_CLOUD_PUBLISHABLE_KEY" == sb_publishable_* ]]
          umask 077
          {
            printf 'NUVIO_SUPABASE_URL=%s\n' "$NUVIO_CLOUD_URL"
            printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$NUVIO_CLOUD_PUBLISHABLE_KEY"
            printf 'TV_LOGIN_WEB_BASE_URL=%s\n' "https://nuvio.tv/tv-login"
          } > legacy-source/local.properties
          echo "Configuracao publica do Nuvio Cloud registrada somente no arquivo temporario de build."
      - name: Validar configuracao obrigatoria de autenticacao
        working-directory: legacy-source
        shell: bash
        run: |
          set -euo pipefail
          tools/env.sh --require-core >/dev/null
          test -s local.properties
          echo "URL e chave publica presentes: build liberada para verificacao remota."
      - name: Verificar servidor de autenticacao antes do build
        shell: bash
        run: |
          set -euo pipefail
          key="$(sed -n 's/^NUVIO_SUPABASE_ANON_KEY=//p' legacy-source/local.properties)"
          # Nunca realizar login sem credenciais do usuario.
          curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
            -H "apikey: $key" "https://api.nuvio.tv/auth/v1/health" > /dev/null
          echo "Servidor respondeu ao health check. Login de usuario e sincronizacao ainda exigem teste real."
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK pelo ambiente do runner
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -d "${ANDROID_HOME:?ANDROID_HOME nao definido no runner}"
          test -d "$ANDROID_HOME/cmdline-tools" || { echo "Ferramentas Android ausentes no runner"; exit 1; }
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
      - name: Instalar SDK e ferramentas nativas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' '24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_HOME/licenses/android-sdk-license"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "NDKs instalados:"
          ls -la "$ANDROID_HOME/ndk" || true
          test -d "$ANDROID_HOME/ndk/27.2.12479018" || { echo "::error::NDK 27.2.12479018 nao foi instalado"; exit 1; }
          test -d "$ANDROID_HOME/cmake/3.22.1" || { echo "::error::CMake 3.22.1 ausente"; exit 1; }
      - name: Dependências de compilação
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build cmake pkg-config autoconf automake libtool nasm yasm python3 ffmpeg
      - name: Compilar bibliotecas nativas de rede e imagens
        working-directory: legacy-source
        shell: bash
        env:
          NUVIO_ANDROID_JOBS: '2'
        run: |
          set -euo pipefail
          # Sem libcurl o APK nao tem o caminho de rede completo. O modo sem curl
          # foi util para validar a primeira compilacao, mas nao para testar playback.
          bash tools/android/deps.sh arm64-v8a armeabi-v7a
          for abi in arm64-v8a armeabi-v7a; do
            for lib in curl jpeg webp; do
              test -s "$HOME/.cache/nuvio-android/prefix/$abi/lib/lib$lib.so" || {
                echo "::error::Falta lib$lib.so em $abi"
                exit 1
              }
            done
          done
      - name: Validar contratos da migração
        run: |
          set -euo pipefail
          python3 migration/check-legacy-auth.py legacy-source
          python3 migration/check-playback-contracts.py legacy-source
          python3 migration/check-android-isolation.py legacy-source
          # Regressao de arte dos cards, especialmente Continuar assistindo.
          bash legacy-source/tests/streammax-cw-art.sh
      - name: Compilar versão experimental sem assinatura de distribuição
        working-directory: legacy-source
        env:
          NUVIO_P2P_MOTOR: 'none'
          NUVIO_RUST_MKVCORE: '0'
          NUVIO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          bash tools/android.sh
      - name: Conferir servidor incorporado no APK e instalacao isolada
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import glob

          configs = {}
          for line in Path("legacy-source/local.properties").read_text(encoding="utf-8").splitlines():
              if "=" in line and not line.lstrip().startswith("#"):
                  k, v = line.split("=", 1)
                  configs[k.strip()] = v.strip()
          values = [configs.get("NUVIO_SUPABASE_URL", ""), configs.get("NUVIO_SUPABASE_ANON_KEY", "")]
          if not all(values):
              raise SystemExit("ERRO: configuracao do servidor incompleta")
          paths = glob.glob("legacy-source/build/android/*-android-debug.apk")
          if len(paths) != 1:
              raise SystemExit(f"ERRO: esperado um APK debug, encontrados {len(paths)}")
          with ZipFile(paths[0]) as apk:
              for abi in ("arm64-v8a", "armeabi-v7a"):
                  entry = f"lib/{abi}/libmain.so"
                  if entry not in apk.namelist():
                      raise SystemExit(f"ERRO: biblioteca principal ausente em {abi}")
                  data = apk.read(entry)
                  for lib in ("curl", "jpeg", "webp"):
                      bundled = f"lib/{abi}/lib{lib}.so"
                      if bundled not in apk.namelist():
                          raise SystemExit(f"ERRO: {bundled} ausente no APK")
                  for name, value in zip(("URL", "chave publica"), values):
                      if value.encode("utf-8") not in data:
                          raise SystemExit(f"ERRO: {name} do servidor nao incorporada em {abi}")
          print("OK: URL e chave publica incorporadas nas duas arquiteturas; valores nao exibidos.")
          PY
          apk=(legacy-source/build/android/*-android-debug.apk)
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$aapt"
          "$aapt" dump badging "${apk[0]}" | grep -q "^package: name='com.streammax.tv.strictdebug'"
          "$aapt" dump badging "${apk[0]}" | grep -Fq "application-label:'StreamMax'"
          echo "OK: app StreamMax verificado por package name e rotulo visivel."
          {
            printf 'Projeto: StreamMax Legacy - TCL\n'
            printf 'Branch: %s\n' "$GITHUB_REF_NAME"
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'GitHub Actions run: %s\n' "$GITHUB_RUN_ID"
            printf 'Android package: com.streammax.tv.strictdebug\n'
            printf 'Base: legacy-source (Android C/SDL e Media3)\n'
            printf 'Nao e a APK Kotlin/fullDebug. Requer teste real de login e player na TCL.\n'
          } > legacy-source/build/android/STREAMMAX-BUILD-INFO.txt
      - name: Disponibilizar APK de teste do player original
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StreamMax-Legacy-TCL-Integracao-${{ github.run_number }}
          path: |
            legacy-source/build/android/*-android-debug.apk
            legacy-source/build/android/STREAMMAX-BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 7
