name: StreamMax APK experimental

# Rodar automaticamente quando a configuracao de build muda.
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/streammax-apk-experimental.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-experimental:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Baixar código de desenvolvimento
        uses: actions/checkout@v4
        with:
          ref: streammax/legacy-migration
      - name: Configurar Nuvio Cloud oficial para login por e-mail
        shell: bash
        env:
          # Dados PUBLICOS do NuvioMedia/self-host/.env.example.
          NUVIO_CLOUD_URL: https://api.nuvio.tv
          NUVIO_CLOUD_PUBLISHABLE_KEY: sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
        run: |
          set -euo pipefail
          [[ "$NUVIO_CLOUD_URL" == "https://api.nuvio.tv" ]]
          [[ "$NUVIO_CLOUD_PUBLISHABLE_KEY" == sb_publishable_* ]]
          umask 077
          {
            printf 'NUVIO_SUPABASE_URL=%s\n' "$NUVIO_CLOUD_URL"
            printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$NUVIO_CLOUD_PUBLISHABLE_KEY"
            printf 'TV_LOGIN_WEB_BASE_URL=%s\n' "https://nuvio.tv/tv-login"
          } > legacy-source/local.properties
          echo "Configuracao publica do Nuvio Cloud registrada somente no arquivo temporario de build."
      - name: Validar configuracao obrigatoria de autenticacao
        working-directory: legacy-source
        shell: bash
        run: |
          set -euo pipefail
          tools/env.sh --require-core >/dev/null
          test -s local.properties
          echo "URL e chave publica presentes: build liberada para verificacao remota."
      - name: Verificar servidor de autenticacao antes do build
        shell: bash
        run: |
          set -euo pipefail
          key="$(sed -n 's/^NUVIO_SUPABASE_ANON_KEY=//p' legacy-source/local.properties)"
          # Nunca realizar login sem credenciais do usuario.
          curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
            -H "apikey: $key" "https://api.nuvio.tv/auth/v1/health" > /dev/null
          echo "Servidor respondeu ao health check. Login de usuario e sincronizacao ainda exigem teste real."
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK pelo ambiente do runner
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -d "${ANDROID_HOME:?ANDROID_HOME nao definido no runner}"
          test -d "$ANDROID_HOME/cmdline-tools" || { echo "Ferramentas Android ausentes no runner"; exit 1; }
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
      - name: Instalar SDK e ferramentas nativas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' '24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_HOME/licenses/android-sdk-license"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "NDKs instalados:"
          ls -la "$ANDROID_HOME/ndk" || true
          test -d "$ANDROID_HOME/ndk/27.2.12479018" || { echo "::error::NDK 27.2.12479018 nao foi instalado"; exit 1; }
          test -d "$ANDROID_HOME/cmake/3.22.1" || { echo "::error::CMake 3.22.1 ausente"; exit 1; }
      - name: Dependências de compilação
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build cmake pkg-config autoconf automake libtool nasm yasm python3 ffmpeg
      - name: Validar contratos da migração
        run: |
          set -euo pipefail
          python3 migration/check-legacy-auth.py legacy-source
          python3 migration/check-playback-contracts.py legacy-source
          python3 migration/check-android-isolation.py legacy-source
      - name: Compilar versão experimental sem assinatura de distribuição
        working-directory: legacy-source
        env:
          NUVIO_SEM_CURL: '1'
          NUVIO_P2P_MOTOR: 'none'
          NUVIO_RUST_MKVCORE: '0'
          NUVIO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          bash tools/android.sh
      - name: Disponibilizar APK de teste
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StreamMax-APK-EXPERIMENTAL
          path: legacy-source/build/android/*-android-debug.apk
          if-no-files-found: error
          retention-days: 7
