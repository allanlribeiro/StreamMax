name: StreamMax Home RC3 APK
on:
  push:
    branches:
      - feature/streammax-home-rc3-accessibility
    paths:
      - 'streammax-home-rc3/standalone/**'
      - '.github/workflows/streammax-home-rc3-build.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: streammax-home-rc3/standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build RC3
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload RC3 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamMax-Home-RC3-debug
          path: streammax-home-rc3/standalone/app/build/outputs/apk/debug/app-debug.apk
