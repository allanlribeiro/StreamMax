name: Validar reproducao StreamMax (Kotlin)

on:
  push:
    branches:
      - feature/reproducao-idiomas-nuvio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playback-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout da branch atual
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Propriedades de build
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        shell: bash
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi
          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      - name: Executar testes de fontes e compilar APK debug
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testFullDebugUnitTest --tests 'com.nuvio.tv.core.streams.StreamAudioLanguageDetectorTest' --tests 'com.nuvio.tv.core.streams.StreamSourceTechnicalSummaryTest' :app:assembleFullDebug --stacktrace

      - name: Disponibilizar APK somente se build passar
        uses: actions/upload-artifact@v4
        with:
          name: StreamMax-reproducao-fullDebug
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
