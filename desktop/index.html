<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>StreamMax</title><link rel="stylesheet" href="ui.css"></head><body>
<header class="app-nav">
  <div class="app-brand" aria-label="StreamMax">STREAM<strong>MAX</strong></div>
  <nav aria-label="Menu do aplicativo">
    <button type="button" data-page="home" aria-current="page">Início</button>
    <button type="button" data-page="account">Conta</button>
  </nav>
  <span class="status" id="app-status" role="status">Iniciando…</span>
</header>
<main class="page">
  <section id="auth-panel" class="state" aria-live="polite">
    <h1 id="auth-title">Conectando ao StreamMax…</h1>
    <p id="auth-description">Verificando a sessão da sua conta.</p>
    <p id="login-code" hidden><code id="login-code-value"></code></p>
    <p id="login-link" hidden></p>
    <div class="state__actions">
      <button type="button" class="primary" id="login-start" hidden>Entrar com a conta</button>
      <button type="button" class="secondary" id="login-open" hidden>Abrir autorização</button>
      <button type="button" class="secondary" id="login-retry" hidden>Verificar autorização</button>
    </div>
    <p class="state__message" id="auth-message"></p>
  </section>
  <section id="home-panel" hidden aria-label="Tela inicial">
    <div id="home-viewport"></div>
    <div class="state" id="home-feedback" hidden aria-live="polite"></div>
    <div class="state__actions" style="justify-content:center">
      <button type="button" class="secondary" id="load-more-rows" hidden>Carregar outras linhas</button>
    </div>
  </section>
  <section id="account-panel" class="account" hidden>
    <h1>Conta e perfis</h1>
    <p id="account-info">Autenticação e sincronização de catálogos do StreamMax.</p>
    <button class="secondary" id="signout">Sair da conta</button>
  </section>
</main>
<section id="detail-panel" class="detail" hidden role="dialog" aria-modal="true" aria-labelledby="detail-name">
 <div class="detail__body">
   <button id="detail-close" type="button" class="secondary detail__close" aria-label="Fechar">Fechar</button>
   <h2 id="detail-name"></h2><p id="detail-description"></p>
   <p class="error-text">A navegação para detalhes e a seleção de fontes ainda estão sendo portadas do Android.</p>
 </div>
</section>
<script src="home-view.js"></script>
<script src="renderer.js"></script>
</body></html>
